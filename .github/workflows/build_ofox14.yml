name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 16.0
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://gitlab.com/naden01/LH8n.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_14.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/tecno/LH8n'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'LH8n'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set device tree links
      run: |
        TREE="${{ github.event.inputs.DEVICE_TREE }}"
        TREE="${TREE%/}"
        TREE="${TREE%.git}"
        echo "CLEAN_DEVICE_TREE=${TREE}" >> $GITHUB_ENV
        echo "device tree (clean): ${TREE}"
      continue-on-error: true

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      continue-on-error: true

    - name: Notify Telegram — Build Started
      run: |
          chmod +x .github/scripts/send_to_telegram.sh
          .github/scripts/send_to_telegram.sh \
            "notify" \
            "${{ github.event.inputs.DEVICE_NAME }}" \
            "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            "" \
            "" \
            "" \
            "" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "${{ secrets.TELEGRAM_TOKEN }}" \
            "${{ github.workflow }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "" \
            ""
            
    - name: Set-up Manifest
      id: sync
      shell: bash
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1' || github.event.inputs.MANIFEST_BRANCH == '16.0'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }} 2>&1 | tee "$GITHUB_WORKSPACE/sync.log"
       
    - name: Clone Device Tree
      id: clone
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        
    - name: Apply Maintainer Avatar
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        AV="${{ github.event.inputs.DEVICE_PATH }}/maintainer.png"
        if [ -f "$AV" ]; then
          find bootable/recovery/gui/theme -path "*/Default/About/maintainer.png" | while read f; do cp -v "$AV" "$f"; done
        else
          echo "No maintainer.png in device tree, skipping"
        fi

    - name: Check Manifest Branch
      run: |
        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "16.0" ]; then
            echo "LUNCH_CMD=lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-bp2a-eng && mka ${{ github.event.inputs.BUILD_TARGET }}image" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "11.0" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "12.1" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "14.1" ]; then
            echo "LUNCH_CMD=lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image" >> $GITHUB_ENV
        else
            echo "LUNCH_CMD=lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && mka ${{ github.event.inputs.BUILD_TARGET }}image" >> $GITHUB_ENV
        fi
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-
      continue-on-error: true
    - name: Building OrangeFox
      id: build
      shell: bash
      env:
        USE_CCACHE: "1"
        CCACHE_EXEC: /usr/bin/ccache
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: "4G"
        CCACHE_COMPRESS: "1"
        CCACHE_COMPILERCHECK: "content"
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        ( while true; do echo "[mon] $(date +%T) $(free -m | awk '/Mem:/{printf "ram %s/%sMB ",$3,$2} /Swap:/{printf "swap %sMB ",$3}')disk-free $(df -h / --output=avail | tail -1)"; sleep 45; done ) &
        { eval "${LUNCH_CMD}"; } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
      continue-on-error: true

    - name: Set Build Date # For Build Date Info, currently using Asia/Manila
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Verify Image Built
      id: verify
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        if ! compgen -G "OrangeFox*.img" > /dev/null; then
          echo "::error::No OrangeFox*.img found in out directory"
          ls -la || true
          exit 1
        fi
        IMG=$(ls OrangeFox*.img | head -n1)
        echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
        echo "MD5_IMG=$(md5sum "$IMG" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        ls -lh "$IMG"
        if compgen -G "OrangeFox*.zip" > /dev/null; then
          ZIP=$(ls OrangeFox*.zip | head -n1)
          echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
          echo "MD5_ZIP=$(md5sum "$ZIP" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
          echo "::warning::No OrangeFox*.zip found (only img will be released)"
        fi

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.CLEAN_DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.CLEAN_DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
        
    - name: Run LDCheck
      if: github.event.inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true

    - name: Notify Telegram — Build Done
      if: success()
      run: |
        .github/scripts/send_to_telegram.sh \
          "release" \
          "${{ github.event.inputs.DEVICE_NAME }}" \
          "${{ github.event.inputs.MANIFEST_BRANCH }}" \
          "${{ env.BUILD_DATE }}" \
          "${{ env.COMMIT_ID }}" \
          "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.run_id }}" \
          "${{ env.CLEAN_DEVICE_TREE }}" \
          "${{ secrets.TELEGRAM_CHAT_ID }}" \
          "${{ secrets.TELEGRAM_TOKEN }}" \
          "${{ github.workflow }}" \
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          "${{ secrets.GITHUB_TOKEN }}" \
          "${{ github.repository }}" \
          "${{ github.run_id }}"

    - name: Notify Telegram — Build Failed
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DEVICE: ${{ github.event.inputs.DEVICE_NAME }}
        MANIFEST: ${{ github.event.inputs.MANIFEST_BRANCH }}
        TREE: ${{ github.event.inputs.DEVICE_TREE }}
        TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
        SYNC_OUTCOME: ${{ steps.sync.outcome }}
        CLONE_OUTCOME: ${{ steps.clone.outcome }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        VERIFY_OUTCOME: ${{ steps.verify.outcome }}
      run: |
        [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "Telegram secrets missing"; exit 0; }

        if [ "$SYNC_OUTCOME" = "failure" ]; then STAGE="Syncing OrangeFox manifest"; LOG="$GITHUB_WORKSPACE/sync.log"
        elif [ "$CLONE_OUTCOME" = "failure" ]; then STAGE="Cloning device tree (check tree URL/branch)"; LOG=""
        elif [ "$BUILD_OUTCOME" = "failure" ]; then STAGE="Building OrangeFox"; LOG="$GITHUB_WORKSPACE/build.log"
        elif [ "$VERIFY_OUTCOME" = "failure" ]; then STAGE="Image was not produced"; LOG="$GITHUB_WORKSPACE/build.log"
        else STAGE="Other step (check run log)"; LOG="$GITHUB_WORKSPACE/build.log"; fi

        ERR=""
        if [ -n "$LOG" ] && [ -f "$LOG" ]; then
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$LOG"
          N=$(grep -n -m1 'FAILED:' "$LOG" | cut -d: -f1)
          if [ -n "$N" ]; then ERR=$(sed -n "${N},$((N+12))p" "$LOG" | cut -c1-300)
          else ERR=$(tail -n 20 "$LOG" | cut -c1-300); fi
        fi

        {
          echo "❌ Build FAILED"
          echo "Workflow: ${{ github.workflow }}"
          echo "Device: $DEVICE"
          echo "Manifest: $MANIFEST"
          echo "Tree: $TREE ($TREE_BRANCH)"
          echo "Failed at: $STAGE"
          echo "Run: $RUN_URL"
          if [ -n "$ERR" ]; then echo; echo "Error:"; echo "$ERR"; fi
        } | head -c 3800 > /tmp/msg.txt

        curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -d chat_id="$TG_CHAT" --data-urlencode text@/tmp/msg.txt || true

        if [ -n "$LOG" ] && [ -f "$LOG" ]; then
          SEND="$LOG"
          if [ "$(stat -c%s "$LOG")" -gt 45000000 ]; then
            tail -n 20000 "$LOG" > /tmp/tail.log; SEND=/tmp/tail.log
          fi
          cp "$SEND" "/tmp/ofox_${DEVICE}_failed.log"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT" -F document=@"/tmp/ofox_${DEVICE}_failed.log" \
            -F caption="🪵 Log ($DEVICE) - failed at: $STAGE" || true
        fi
        
