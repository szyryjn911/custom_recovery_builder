name: Build - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-16.0'
        type: choice
        options:
        - twrp-16.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' # Your already made Device Tree for TWRP
        required: true
        default: 'https://github.com/naden01/tecno_LH8n-TWRP'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' # Your Device Tree Branch, make sure it's right.
        required: true
        default: 'android-16.0'
      DEVICE_PATH:
        description: 'Specify your Device Path' # As is, just like your DEVICE_PATH in your BoardConfig.mk
        required: true
        default: 'device/tecno/LH8n'
      DEVICE_NAME:
        description: 'Specify your Device Codename' # As is, just like your PRODUCT_DEVICE in your device tree.
        required: true
        default: 'LH8n'
      BUILD_TARGET:
        description: 'Specify your Build Target' # Pick among boot, recovery and vendor_boot
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Display Inputs
      run: |
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"

    - name: Set device tree links
      run: |
        TREE="${{ github.event.inputs.DEVICE_TREE }}"
        TREE="${TREE%/}"
        TREE="${TREE%.git}"
        echo "CLEAN_DEVICE_TREE=${TREE}" >> $GITHUB_ENV
        echo "device tree (clean): ${TREE}"
      continue-on-error: true

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      continue-on-error: true
    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ inputs.MANIFEST_BRANCH == 'twrp-16.0' }}
        if_true: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
      
    - name: Initialize Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        sed -i '/<remove-project name="platform\/external\/gflags"  \/>/d' .repo/manifests/remove-minimal.xml

    - name: Notify Telegram — Build Started
      run: |
          chmod +x .github/scripts/send_to_telegram.sh
          .github/scripts/send_to_telegram.sh \
            "notify" \
            "${{ github.event.inputs.DEVICE_NAME }}" \
            "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            "" \
            "" \
            "" \
            "" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "${{ secrets.TELEGRAM_TOKEN }}" \
            "${{ github.workflow }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "" \
            ""
            
    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync
      
    - name: Clone Device Tree
      run: |
        cd android-recovery
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
      
    - name: Check Build Makefile
      run: |
        cd android-recovery
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile file found!"
            exit 1
        fi

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-
      continue-on-error: true
    - name: Building Image
      id: build
      shell: bash
      env:
        USE_CCACHE: "1"
        CCACHE_EXEC: /usr/bin/ccache
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: "4G"
        CCACHE_COMPRESS: "1"
        CCACHE_COMPILERCHECK: "content"
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        { lunch ${{ env.DEVICE_MAKEFILE }}-bp2a-eng && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all); } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
      continue-on-error: true

    - name: Verify Image Built
      id: verify
      run: |
        T="${{ github.event.inputs.BUILD_TARGET }}"
        [ "$T" = "vendorboot" ] && T="vendor_boot"
        IMG="android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${T}.img"
        if [ ! -s "$IMG" ]; then
          echo "::error::Image not found or empty: $IMG"
          exit 1
        fi
        ls -lh "$IMG"

    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release (boot and recovery)
      if: github.event.inputs.BUILD_TARGET == 'boot' || github.event.inputs.BUILD_TARGET == 'recovery'
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.CLEAN_DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.CLEAN_DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
      
    - name: Upload to Release (if vendor_boot)
      if: github.event.inputs.BUILD_TARGET == 'vendorboot'
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.CLEAN_DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.CLEAN_DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
      
    - name: Run LDCheck
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../android-recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true

    - name: Notify Telegram — Build Done
      if: success()
      run: |
        .github/scripts/send_to_telegram.sh \
          "release" \
          "${{ github.event.inputs.DEVICE_NAME }}" \
           "${{ github.event.inputs.MANIFEST_BRANCH }}" \
           "${{ env.BUILD_DATE }}" \
           "${{ env.COMMIT_ID }}" \
           "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.run_id }}" \
           "${{ env.CLEAN_DEVICE_TREE }}" \
           "${{ secrets.TELEGRAM_CHAT_ID }}" \
           "${{ secrets.TELEGRAM_TOKEN }}" \
           "${{ github.workflow }}" \
           "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
           "${{ secrets.GITHUB_TOKEN }}" \
           "${{ github.repository }}" \
           "${{ github.run_id }}"

    - name: Notify Telegram — Build Failed
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DEVICE: ${{ github.event.inputs.DEVICE_NAME }}
        MANIFEST: ${{ github.event.inputs.MANIFEST_BRANCH }}
        TREE: ${{ github.event.inputs.DEVICE_TREE }}
        TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        VERIFY_OUTCOME: ${{ steps.verify.outcome }}
      run: |
        [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "Telegram secrets missing"; exit 0; }
        LOG="$GITHUB_WORKSPACE/build.log"

        if [ "$BUILD_OUTCOME" = "failure" ]; then STAGE="Building image"
        elif [ "$VERIFY_OUTCOME" = "failure" ]; then STAGE="Image was not produced"
        else STAGE="Setup / sync / clone / upload (check run log)"; fi

        ERR=""
        if [ -f "$LOG" ]; then
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$LOG"
          N=$(grep -n -m1 'FAILED:' "$LOG" | cut -d: -f1)
          if [ -n "$N" ]; then ERR=$(sed -n "${N},$((N+12))p" "$LOG" | cut -c1-300)
          else ERR=$(tail -n 20 "$LOG" | cut -c1-300); fi
        fi

        {
          echo "❌ Build FAILED"
          echo "Workflow: ${{ github.workflow }}"
          echo "Device: $DEVICE"
          echo "Manifest: $MANIFEST"
          echo "Tree: $TREE ($TREE_BRANCH)"
          echo "Failed at: $STAGE"
          echo "Run: $RUN_URL"
          if [ -n "$ERR" ]; then echo; echo "Error:"; echo "$ERR"; fi
        } | head -c 3800 > /tmp/msg.txt

        curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -d chat_id="$TG_CHAT" --data-urlencode text@/tmp/msg.txt || true

        if [ -f "$LOG" ]; then
          SEND="$LOG"
          if [ "$(stat -c%s "$LOG")" -gt 45000000 ]; then
            tail -n 20000 "$LOG" > /tmp/build_tail.log; SEND=/tmp/build_tail.log
          fi
          cp "$SEND" "/tmp/build_${DEVICE}_failed.log"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT" -F document=@"/tmp/build_${DEVICE}_failed.log" \
            -F caption="🪵 Build log ($DEVICE) - failed at: $STAGE" || true
        fi
        
